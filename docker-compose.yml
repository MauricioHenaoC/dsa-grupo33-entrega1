services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    restart: unless-stopped

  tablero:
    build:
      context: .
      dockerfile: app/Dockerfile
    ports:
      - "8050:8050"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped